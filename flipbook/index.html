<script>
const $ = s => document.querySelector(s), N = 16;
const pages = [...document.querySelectorAll('#book .page')];
const mobile = () => innerWidth < 760 || innerWidth < innerHeight;
let flip;
// ---------------------------------------------------------------- soft paper sound (generated, no audio file)
let ac, sound = localStorage.getItem('flipSound') !== 'off';
function swish() {
  if (!sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const d = .42, n = ac.sampleRate * d, buf = ac.createBuffer(1, n, ac.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < n; i++) { const t = i / n; ch[i] = (Math.random() * 2 - 1) * Math.pow(Math.sin(Math.PI * Math.min(1, t * 1.3)), 2) * (1 - t) ; }
    const src = ac.createBufferSource(); src.buffer = buf;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.setValueAtTime(2600, ac.currentTime); bp.frequency.exponentialRampToValueAtTime(900, ac.currentTime + d); bp.Q.value = .7;
    const g = ac.createGain(); g.gain.value = .16; src.connect(bp).connect(g).connect(ac.destination); src.start();
  } catch (e) {}
}
// ---------------------------------------------------------------- book
function build(start) {
  if (flip) { start = flip.getCurrentPageIndex(); flip.destroy(); const b = document.createElement('div'); b.id = 'book'; pages.forEach(p => b.appendChild(p)); $('#wrap').appendChild(b); }
  const box = $('#wrap').getBoundingClientRect(), single = mobile();
  const ratio = 535 / 770, wMax = single ? box.width : box.width / 2;
  let w = Math.min(wMax, box.height / ratio); w = Math.max(240, Math.floor(w));
  flip = new St.PageFlip($('#book'), {
    width: w, height: Math.round(w * ratio), size: 'fixed', showCover: true, usePortrait: single,
    maxShadowOpacity: .55, drawShadow: true, flippingTime: 820, mobileScrollSupport: false, swipeDistance: 24, clickEventForward: true, useMouseEvents: true, startPage: start || 0, autoSize: false
  });
  flip.loadFromHTML(document.querySelectorAll('#book .page'));
  flip.on('flip', e => { update(e.data); swish(); });
  flip.on('changeOrientation', () => update(flip.getCurrentPageIndex()));
  update(flip.getCurrentPageIndex());
}
function update(i) {
  const single = flip.getOrientation() === 'portrait';
  let a = i + 1, label = a;
  if (!single && a > 1 && a < N) { const l = a % 2 === 0 ? a : a - 1; label = l + '–' + Math.min(N, l + 1); }
  $('#count').innerHTML = label + ' <small>/ ' + N + '</small>';
  $('#prog').style.width = (Math.min(N, single ? a : (a === 1 ? 1 : Math.min(N, a + (a % 2 === 0 ? 1 : 0)))) / N * 100) + '%';
  $('#prevB').disabled = i <= 0; $('#nextB').disabled = i >= N - 1 || (!single && i >= N - 2 && i !== 0);
  document.querySelectorAll('#thumbs button').forEach((b, k) => b.classList.toggle('cur', k === i || (!single && i > 0 && Math.floor((k + 1) / 2) === Math.floor((i + 1) / 2) && k > 0)));
  history.replaceState(null, '', '#p' + a);
}
const go = i => flip.flip(Math.max(0, Math.min(N - 1, i)), 'top');
$('#bPrev').onclick = $('#prevB').onclick = () => flip.flipPrev('top');
$('#bNext').onclick = $('#nextB').onclick = () => flip.flipNext('top');
$('#bFirst').onclick = () => go(0);
$('#bLast').onclick = () => go(N - 1);
$('#bThumbs').onclick = () => { $('#thumbs').classList.toggle('on'); $('#bThumbs').classList.toggle('on'); };
document.querySelectorAll('#thumbs button').forEach((b, k) => b.onclick = () => { $('#thumbs').classList.remove('on'); $('#bThumbs').classList.remove('on'); setTimeout(() => go(k), 150); });
$('#bZoom').onclick = () => { document.body.classList.toggle('zoom'); $('#bZoom').classList.toggle('on'); };
$('#bSound').classList.toggle('on', sound);
$('#bSound').onclick = () => { sound = !sound; localStorage.setItem('flipSound', sound ? 'on' : 'off'); $('#bSound').classList.toggle('on', sound); $('#bSound .w').style.opacity = sound ? 1 : .2; };
$('#bSound .w').style.opacity = sound ? 1 : .2;
$('#bFull').onclick = () => { const d = document; if (!d.fullscreenElement) (d.documentElement.requestFullscreen || d.documentElement.webkitRequestFullscreen)?.call(d.documentElement); else d.exitFullscreen?.(); };
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { flip.flipNext('top'); e.preventDefault(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') flip.flipPrev('top');
  else if (e.key === 'Home') go(0); else if (e.key === 'End') go(N - 1);
  else if (e.key === 'Escape') { document.body.classList.remove('zoom'); $('#bZoom').classList.remove('on'); $('#thumbs').classList.remove('on'); $('#bThumbs').classList.remove('on'); }
});
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => build(), 250); });
// ---------------------------------------------------------------- start once the first spread is decoded
const first = ['p01.webp', 'p02.webp', 'p03.webp'].map(s => { const i = new Image(); i.src = s; return i.decode().catch(() => {}); });
if (innerWidth < innerHeight && innerWidth < 760) $('#hint').textContent = 'Swipe to turn · rotate your phone for a larger view';
Promise.all(first).then(() => {
  if (!window.St) { $('#load span').textContent = 'The flipbook could not load. Please reload the page.'; return; }
  const m = location.hash.match(/p(\d+)/); build(m ? Math.max(0, Math.min(N, +m[1]) - 1) : 0);
  $('#load').style.opacity = 0; setTimeout(() => $('#load').remove(), 650);
  setTimeout(() => $('#hint').style.opacity = 0, 4200); setTimeout(() => $('#hint').remove(), 5000);
});
</script>
